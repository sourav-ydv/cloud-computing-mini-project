apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: cloudmp
servers: 1
agents: 1
ports:
  - port: 8081:80
    nodeFilters:
      - loadbalancer
  - port: 30833:30833
    nodeFilters:
      - server:0
options:
  k3d:
    wait: true
    timeout: "120s"
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
